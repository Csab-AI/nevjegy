<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KOVÁCS AI-GÁBOR // RESEARCH TOWER</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body{ background:#000; width:100vw; height:100vh; overflow:hidden; }
        #camera-bg{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; transition: filter 0.5s; }
        
        #ar-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:10; touch-action:none; }
        
        #vignette{ position:fixed; inset:0; z-index:5; pointer-events:none; background:radial-gradient(circle at center, transparent 30%, rgba(0,2,10,0.8) 100%); }

        /* ════ SPLASH ════ */
        #splash{
            position:fixed; inset:0; z-index:1000;
            background:radial-gradient(ellipse at 50% 60%, #050d1a 0%, #000 80%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:35px;
            transition:opacity 1.2s ease, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #splash.hidden{ opacity:0; pointer-events:none; transform:scale(1.05); }
        .sp-eyebrow{ font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:10px; color:#ffffff44; }
        .sp-name{
            font-family:'Cormorant Garamond',serif; font-size:clamp(42px,10vw,72px); font-weight:400;
            color:#fff; text-align:center; letter-spacing:8px; line-height:1.1;
            text-shadow: 0 0 40px rgba(0,207,255,0.3);
        }
        .sp-name em{ color:var(--p,#00cfff); font-style:normal; display:block; font-size:0.35em; letter-spacing:16px; margin-top:12px; font-family:'Share Tech Mono',monospace; }
        .sp-divider{ width:100px; height:2px; background:var(--p,#00cfff); opacity:0.6; box-shadow:0 0 15px var(--p,#00cfff); }
        #start-btn{
            font-family:'Share Tech Mono',monospace; font-size:14px; letter-spacing:5px; font-weight:bold;
            color:#000; background:var(--p,#00cfff); border:none;
            padding:20px 54px; cursor:pointer; text-transform:uppercase;
            clip-path:polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%);
            position:relative; overflow:hidden; transition:all 0.3s;
            box-shadow: 0 0 25px var(--pg);
        }
        #start-btn:active{ opacity:0.8; transform:scale(0.95); }
        #start-btn::before{
            content:''; position:absolute; inset:0;
            background:linear-gradient(90deg,transparent,#fff8,transparent);
            transform:translateX(-100%); animation:sh 2.5s infinite;
        }
        @keyframes sh{ to{ transform:translateX(220%); } }

        /* ════ CSS VARS (Adaptív színek) ════ */
        :root{ --p: #00cfff; --s: #0044ff; --a: #ff0066; --pg: #00cfff66; --pb: rgba(0,207,255,0.08); }

        /* ════ HUD ════ */
        #hud{ position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0; transition:opacity 1s ease 0.5s; }
        #hud.visible{ opacity:1; }

        .corner{ position:absolute; width:24px; height:24px; border-style:solid; border-color:var(--p); opacity: 0.5; transition: border-color 0.5s; }
        .c-tl{ top:20px; left:20px; border-width:2px 0 0 2px; }
        .c-tr{ top:20px; right:20px; border-width:2px 2px 0 0; }
        .c-bl{ bottom:20px; left:20px; border-width:0 0 2px 2px; }
        .c-br{ bottom:20px; right:20px; border-width:0 2px 2px 0; }

        #namecard{ position:absolute; top:30px; left:26px; max-width:60vw; }
        .nc-name{ font-family:'Cormorant Garamond',serif; font-size:clamp(20px,5vw,26px); font-weight:700; color:#fff; letter-spacing:4px; text-shadow:0 0 24px var(--pg); transition: text-shadow 0.5s; }
        .nc-role{ font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--p); letter-spacing:5px; margin-top:6px; font-weight:bold; transition: color 0.5s; }
        .nc-sep{ width:120px; height:2px; background:linear-gradient(90deg,var(--p),transparent); margin:10px 0; opacity:0.5; transition: background 0.5s; }
        .nc-data{ font-family:'Share Tech Mono',monospace; font-size:9px; color:#ffffff88; line-height:2; letter-spacing:1px; }
        .nc-data b{ color:#ffffff; }

        /* Akció gombok a HUD-on belül */
        .action-btns { display: flex; gap: 10px; margin-top: 12px; pointer-events: auto; }
        .act-btn {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; font-weight: bold; letter-spacing: 2px;
            padding: 8px 12px; border: 1px solid var(--p); background: var(--pb);
            color: var(--p); cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center;
            clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
            transition: all 0.3s; text-shadow: 0 0 8px var(--pg);
        }
        .act-btn:active { background: var(--p); color: #000; transform: scale(0.95); text-shadow: none; }

        #statusbox{ position:absolute; top:30px; right:26px; text-align:right; }
        .sb-r{ font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:3px; color:#ffffff66; margin-bottom:6px; }
        .sb-r b{ color:var(--p); opacity:0.9; transition: color 0.5s; }
        #adapt-status { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--p); opacity: 0.6; letter-spacing:2px; transition: color 0.5s; }

        #build-ui{ position:absolute; bottom:150px; left:50%; transform:translateX(-50%); width:280px; text-align:center; transition:opacity 0.8s, transform 0.8s; }
        #build-ui.gone{ opacity:0; pointer-events:none; transform:translate(-50%, 15px); }
        #bp-label{ font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:5px; color:var(--p); margin-bottom:12px; font-weight:bold; transition: color 0.5s; }
        #bp-track{ height:2px; background:var(--pb); position:relative; overflow:visible; }
        #bp-fill{ position:absolute; left:0; top:0; height:2px; background:linear-gradient(90deg,var(--s),var(--p)); box-shadow:0 0 12px var(--p); width:0%; transition:width 0.4s ease; }
        #bp-dot{ position:absolute; top:-4px; width:10px; height:10px; background:var(--p); border-radius:50%; box-shadow:0 0 15px var(--p); right:0; }
        #bp-text{ font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:3px; color:#ffffff66; margin-top:12px; }

        #tap-hint{
            position:absolute; bottom:140px; left:50%; transform:translateX(-50%);
            font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:6px; font-weight:bold;
            color:#ffffff88; white-space:nowrap; opacity:0; transition:opacity 1s;
            pointer-events:none; text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        #tap-hint.show{ opacity:1; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* ════ PROJEKT KÁRTYA PANEL (MODAL) ════ */
        #modal-backdrop {
            position: fixed; inset: 0; z-index: 25; display: none;
            background: rgba(0,0,0,0.1); 
        }
        #modal-backdrop.open { display: block; }

        #proj-panel{
            position:absolute; bottom:0; left:0; right:0; z-index:30;
            pointer-events:none; 
            transform:translateY(100%);
            transition:transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            display: flex; flex-direction: column; justify-content: flex-end;
            max-height: 85vh; 
        }
        #proj-panel.open{ 
            transform:translateY(0); 
            pointer-events:all; 
        }

        .pp-glass{
            background:linear-gradient(to top, rgba(0,4,12,0.98) 0%, rgba(2,6,18,0.92) 70%, rgba(5,10,25,0.85) 100%);
            backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
            border-top:2px solid var(--pg);
            padding:30px 25px 40px;
            box-shadow: 0 -15px 50px rgba(0,0,0,0.8);
            overflow-y: auto; 
            touch-action: pan-y; 
            transition: border-color 0.5s;
        }

        #floor-nav{ display:flex; gap:12px; margin-bottom:25px; overflow-x:auto; scrollbar-width:none; padding-bottom:6px; }
        #floor-nav::-webkit-scrollbar{ display:none; }
        .fn-card{
            flex-shrink:0; width:70px; padding:12px 8px; text-align:center;
            border:1px solid #ffffff22; cursor:pointer;
            transition:all 0.3s; clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
            background: rgba(255,255,255,0.02);
        }
        .fn-card.active{ border-color:var(--p) !important; background:var(--pb) !important; transform:translateY(-5px); box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .fn-num{ font-family:'Orbitron',sans-serif; font-size:14px; font-weight:900; margin-bottom:6px; line-height:1; }
        .fn-dot{ width:6px; height:6px; border-radius:50%; margin:0 auto; }
        .fn-name{ font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; color:#ffffff88; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        .pp-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:20px; }
        #pp-badge{
            font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900;
            width:60px; height:60px; border-radius:6px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center;
            border:2px solid var(--pg); color:var(--p); background:var(--pb);
            box-shadow: inset 0 0 20px var(--pb); transition: all 0.5s;
        }
        .pp-titles{ flex:1; min-width:0; }
        #pp-name{ font-family:'Cormorant Garamond',serif; font-size:clamp(26px,7vw,36px); font-weight:700; color:#fff; letter-spacing:3px; line-height:1.1; transition: text-shadow 0.5s; }
        #pp-sub{ font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:4px; margin-top:8px; opacity:0.9; font-weight:bold; transition: color 0.5s; }

        .pp-nav{ display:flex; gap:12px; margin-left:auto; align-self:center; }
        .pp-nav-btn{
            font-family:'Share Tech Mono',monospace; font-size:14px; width:44px; height:40px; 
            border:1px solid var(--pg); background:rgba(0,0,0,0.5); color:var(--p); 
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); transition: all 0.3s;
        }
        
        #pp-desc{
            font-family:'Cormorant Garamond',serif; font-size:clamp(18px,5vw,24px);
            font-weight:400; color:#ffffffee; line-height:1.7; letter-spacing:0.5px;
            margin-bottom:25px; padding-bottom:25px; border-bottom:1px solid #ffffff22;
        }
        
        .pp-tech{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px; }
        .tag{
            font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:3px; font-weight:bold;
            padding:8px 14px; border:1px solid var(--pg); color:var(--p); background:var(--pb);
            clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%); transition: all 0.5s;
        }
        
        .pp-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom: 20px;}
        .sbox{ text-align:center; padding:16px 6px; border:1px solid #ffffff15; background:rgba(255,255,255,0.02); clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }
        .sv{ font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; color:var(--p); text-shadow: 0 0 15px var(--pg); transition: all 0.5s; }
        .sl{ font-family:'Share Tech Mono',monospace; font-size:10px; font-weight:bold; letter-spacing:3px; color:#ffffff66; margin-top:6px; }

        #pp-close-btn-large {
            width: 100%; padding: 18px; margin-top: 10px;
            font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: bold; letter-spacing: 6px;
            color: #fff; background: rgba(255,255,255,0.05); border: 1px solid #ffffff33;
            cursor: pointer; text-align: center; transition: all 0.3s;
            clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
        }
        #pp-close-btn-large:active { background: rgba(255,255,255,0.15); border-color: #fff; }

    </style>
</head>

            <div class="sbox"><div class="sv" id="sv2">–</div><div class="sl" id="sl2">–</div></div>
            <div class="sbox"><div class="sv" id="sv3">–</div><div class="sl" id="sl3">–</div></div>
        </div>

        <button id="pp-close-btn-large" onclick="closePanel()">✕ VISSZA A TORONYHOZ</button>
    </div>
</div>

<!-- Splash -->
<div id="splash">
    <div class="sp-eyebrow">A R   P O R T F Ó L I Ó</div>
    <div class="sp-name">RESEARCH<br>TOWER<em>KOVÁCS AI-GÁBOR</em></div>
    <div class="sp-divider"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ════════════════════════════════════════════════════════════
// ÁLLAPOT ÉS ADAPTÍV VÁLTOZÓK
// ════════════════════════════════════════════════════════════
let scene, camera, renderer, raycaster, mouse;
let towerGroup, floorGroups=[];
let buildPhase='idle';
let selectedFloor=-1, panelOpen=false;

// Új: "Data Burst" Animációs változó
let pulseAnim = 0; 

// Kamera
let gyroAvail=false, tRotX=0, tRotY=0, cRotX=0, cRotY=0;
let touchX=0, touchY=0, touchMoved=false;

// Világítás referenciák
let keyLight, fillLight;

// Adaptív Analitika (Valós idejű Fény és Szín illesztés)
let sampleCanvas, sampleCtx, lastSample=0;
let envBright = 0.5, targetBright = 0.5; // Fényesség: 0 (nagyon sötét) -> 1 (nagyon világos)
let currentEnvColor = new THREE.Color(0x00cfff); 
let targetEnvColor = new THREE.Color(0x00cfff);

// Épület dimenziók
const FH=0.65, FW=1.4, BASE_Y=-1.8;
const BUILD_S=16; 

// ════════════════════════════════════════════════════════════
// INDÍTÁS
// ════════════════════════════════════════════════════════════
async function startAR(){
    try{
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        document.getElementById('camera-bg').srcObject=stream;

        // Háttér elemző vászon inicializálása
        sampleCanvas=document.createElement('canvas');
        sampleCanvas.width=64; sampleCanvas.height=36;
        sampleCtx=sampleCanvas.getContext('2d',{willReadFrequently:true});

        initThree();
        buildFloorNav();
        startBuild();
        animate();

        document.getElementById('hud').classList.add('visible');
        document.getElementById('splash').classList.add('hidden');
        setTimeout(()=>document.getElementById('splash').style.display='none',1200);
        setInterval(()=>{ const e=document.getElementById('sb-clock'); if(e) e.textContent=new Date().toTimeString().slice(0,5); },1000);

    }catch(err){
        alert("Kamera hiba: Engedélyezd a kamerát a böngészőben!");
        document.getElementById('splash').style.display='none';
    }
}

// ════════════════════════════════════════════════════════════
// NÉVJEGY LETÖLTÉS (vCard)
// ════════════════════════════════════════════════════════════
function saveContact() {
    // 1. vCard (.vcf) Fájl generálása
    const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Kovács AI-Gábor
ORG:Neural Architect
TITLE:Lead AI Engineer
TEL;TYPE=WORK,VOICE:+36123456789
EMAIL:ai@kovacs.dev
URL:https://github.com/kovacs-ai
NOTE:Kiterjesztett Valóság Portfólióból mentve
END:VCARD`;

    const blob = new Blob([vcardData], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    
    // Láthatatlan letöltő link létrehozása és aktiválása
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Kovacs_AI_Gabor.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // 2. Ui Gomb Vizuális Visszajelzés
    const btn = document.getElementById('btn-contact');
    const originalText = btn.innerHTML;
    btn.innerHTML = "✓ SIKERES MENTÉS";
    btn.style.background = "var(--p)";
    btn.style.color = "#000";
    setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.background = "";
        btn.style.color = "";
    }, 2500);

    // 3. Torony "Data Burst" Animáció elindítása
    pulseAnim = 1.0; 
}


// ════════════════════════════════════════════════════════════
// KÖRNYEZET-ANALIZÁLÓ 
// ════════════════════════════════════════════════════════════
function analyzeBackground(){
    const video=document.getElementById('camera-bg');
    if(video.readyState !== video.HAVE_ENOUGH_DATA || !sampleCtx) return;
    
    // Leképzünk egy pici, homályosított verziót a videóból
    sampleCtx.drawImage(video,0,0,64,36);
    const data=sampleCtx.getImageData(0,0,64,36).data;
    
    let r=0,g=0,b=0, count=0;
    // Csak minden 16. pixelt nézzük a gyorsaságért
    for(let i=0;i<data.length;i+=16){ 
        r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; 
    }
    r/=count; g/=count; b/=count;
    
    // Fényesség (Luminance) számítása
    targetBright = (0.299*r + 0.587*g + 0.114*b) / 255;
    
    // Domináns Szín kinyerése
    const hsl = {};
    new THREE.Color(r/255, g/255, b/255).getHSL(hsl);
    
    // Ha a szoba nem teljesen szürke/fekete, kiemeljük a színét
    if (hsl.s > 0.05 && targetBright > 0.05) {
        // Megnöveljük a szaturációt a cyberpunk hatásért
        targetEnvColor.setHSL(hsl.h, Math.min(hsl.s * 2.0, 0.9), 0.5); 
    } else {
        targetEnvColor.setHex(0x00cfff); // Vissza az alapértelmezett kékre
    }

    // UI Szöveg frissítése a menüben
    const as = document.getElementById('adapt-status');
    if(as) {
        if(targetBright < 0.3) as.textContent = "NIGHT_MODE_ACTIVE";
        else if (targetBright > 0.7) as.textContent = "DAYLIGHT_SYNC";
        else as.textContent = "ENV_SYNC_NORMAL";
    }
}

// ════════════════════════════════════════════════════════════
// THREE INIT - MOZISZERŰ FÉNYELÉS ÉS ÁRNYÉKOK
// ════════════════════════════════════════════════════════════
function initThree(){
    const canvas=document.getElementById('ar-canvas');
    const W=window.innerWidth, H=window.innerHeight;
    
    renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    renderer.setSize(W,H); 
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setClearColor(0x000000, 0); 
    
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    scene=new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000511, 0.035);

    camera=new THREE.PerspectiveCamera(52,W/H,0.1,200);
    camera.position.set(0, 0.5, 7.5);
    camera.lookAt(0, 1.2, 0);
    
    raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();

    scene.add(new THREE.AmbientLight(0xffffff, 0.25));
    
    keyLight = new THREE.DirectionalLight(0xffddaa, 1.5); 
    keyLight.position.set(-4, 10, 6); 
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);
    
    const rimLight = new THREE.DirectionalLight(0x00cfff, 1.8); 
    rimLight.position.set(5, 3, -6); 
    scene.add(rimLight);

    // Az alsó derítő fény színét majd a környezet határozza meg!
    fillLight = new THREE.PointLight(0x00cfff, 1.2, 15);
    fillLight.position.set(0, BASE_Y + 1, 4);
    scene.add(fillLight);

    towerGroup=new THREE.Group(); scene.add(towerGroup);

    buildGround();
    buildCinematicFloors(); 
    setupGyro();

    window.addEventListener('resize',()=>{
        const W=window.innerWidth,H=window.innerHeight;
        camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
    });
}

function buildGround(){
    const gGroup = new THREE.Group();
    gGroup.position.y = BASE_Y;
    scene.add(gGroup);

    const baseGeo = new THREE.CylinderGeometry(4, 4, 0.1, 32);
    const baseMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.9, metalness: 0.2});
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.05;
    baseMesh.receiveShadow = true;
    gGroup.add(baseMesh);

    const r1 = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.015, 16, 100), new THREE.MeshBasicMaterial({color:0x00cfff, transparent:true, opacity:0.8}));
    r1.rotation.x = Math.PI/2; r1.position.y = 0.02; r1.name='r1'; gGroup.add(r1);
    
    const r2 = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.005, 16, 100), new THREE.MeshBasicMaterial({color:0x0044ff, transparent:true, opacity:0.4}));
    r2.rotation.x = Math.PI/2; r2.position.y = 0.02; r2.name='r2'; gGroup.add(r2);
}

function buildCinematicFloors(){
    const gap = 0.05; 
    const actualFH = FH - gap;

    const slabMat = new THREE.MeshStandardMaterial({color: 0x2a2a2a, metalness: 0.7, roughness: 0.6}); 
    const coreMat = new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8, roughness: 0.8}); 
    const pillarMat = new THREE.MeshStandardMaterial({color: 0x1a1a1a, metalness: 0.9, roughness: 0.4}); 

    FLOORS.forEach((data,i)=>{
        const group=new THREE.Group();
        const radius = FW * Math.pow(0.92, i);
        
        group.position.set(0, BASE_Y + (i + 0.5) * FH, 0);
        group.scale.set(1,0.001,1); 

        const slabGeo = new THREE.CylinderGeometry(radius, radius, 0.08, 16);
        const slab = new THREE.Mesh(slabGeo, slabMat);
        slab.position.y = -actualFH/2 + 0.04;
        slab.castShadow = true; slab.receiveShadow = true;
        group.add(slab);

        const glassRadius = radius * 0.88;
        const glassGeo = new THREE.CylinderGeometry(glassRadius, glassRadius, actualFH - 0.08, 16);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x02050a, 
            emissive: new THREE.Color(data.hex), 
            emissiveIntensity: 0.02, 
            metalness: 0.9, roughness: 0.05, clearcoat: 1.0, 
            transparent: true, opacity: 0.85
        });
        const glass=new THREE.Mesh(glassGeo, glassMat);
        glass.castShadow = true; glass.receiveShadow = true;
        group.add(glass);
        glass.userData={fi:i}; 

        const coreGeo = new THREE.CylinderGeometry(radius*0.35, radius*0.35, actualFH, 8);
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.castShadow = true; core.receiveShadow = true;
        group.add(core);

        for(let w=1; w<=3; w++){
            const hFrameGeo = new THREE.TorusGeometry(glassRadius, 0.012, 8, 32);
            const hFrame = new THREE.Mesh(hFrameGeo, pillarMat);
            hFrame.rotation.x = Math.PI/2;
            hFrame.position.y = -actualFH/2 + (actualFH/4)*w;
            hFrame.castShadow = true; hFrame.receiveShadow = true;
            group.add(hFrame);
        }

        const pillarCount = 8;
        for(let p=0; p<pillarCount; p++){
            const ang = (p/pillarCount)*Math.PI*2 + (i%2===0 ? 0 : Math.PI/pillarCount); 
            const pGeo = new THREE.CylinderGeometry(0.025, 0.025, actualFH, 8);
            const pillar = new THREE.Mesh(pGeo, pillarMat);
            pillar.position.set(Math.cos(ang)*radius*0.96, 0, Math.sin(ang)*radius*0.96);
            pillar.castShadow = true; pillar.receiveShadow = true;
            group.add(pillar);
        }

        const ringGeo = new THREE.CylinderGeometry(radius*0.95, radius*0.95, gap*0.6, 32);
        const stripMat = new THREE.MeshBasicMaterial({color:data.hex, transparent:true, opacity:0.9, blending: THREE.AdditiveBlending});
        const strip = new THREE.Mesh(ringGeo, stripMat);
        strip.position.y = -actualFH/2 - gap/2;
        group.add(strip);

        const lightGroup = new THREE.Group();
        for(let l=0; l<12; l++){
            const lGeo = new THREE.BoxGeometry(0.04, 0.02, 0.02);
            const lMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent:true, opacity: 0.6 + Math.random()*0.4});
            const light = new THREE.Mesh(lGeo, lMat);
            const a = Math.random() * Math.PI * 2;
            light.position.set(Math.cos(a)*glassRadius, (Math.random()-0.5)*actualFH*0.8, Math.sin(a)*glassRadius);
            light.rotation.y = -a;
            lightGroup.add(light);
        }
        group.add(lightGroup);

        towerGroup.add(group);
        floorGroups.push({group, glass, glassMat, stripMat, lightGroup, data, built:false, exScale:1, exY:0});
    });

    buildAntenna();
}

function buildAntenna(){
    const topY=BASE_Y+FLOORS.length*FH;
    const rTop = FW * Math.pow(0.92, FLOORS.length);
    
    const base = new THREE.Mesh(new THREE.CylinderGeometry(rTop*0.2, rTop*0.6, 0.3, 16), new THREE.MeshStandardMaterial({color:0x222222, metalness:0.8, roughness:0.5, transparent:true, opacity:0}));
    base.position.set(0, topY+0.15, 0); base.name='antBase'; base.castShadow = true; scene.add(base);

    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.02, 2.0, 8),new THREE.MeshStandardMaterial({color:0x88ccff, metalness:1, roughness:0.2, transparent:true,opacity:0}));
    rod.position.set(0,topY+1.1,0); rod.name='antRod'; rod.castShadow = true; scene.add(rod);

    const tip=new THREE.Mesh(new THREE.OctahedronGeometry(0.08),new THREE.MeshBasicMaterial({color:0x00cfff,transparent:true,opacity:0, wireframe:true}));
    tip.position.set(0,topY+2.2,0); tip.name='antTip'; scene.add(tip);

    const glow=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,16),new THREE.MeshBasicMaterial({color:0x00cfff,transparent:true,opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
    glow.position.copy(tip.position); glow.name='antGlow'; scene.add(glow);
}

// ════════════════════════════════════════════════════════════
// BUILD ANIMÁCIÓ
// ════════════════════════════════════════════════════════════
function startBuild(){
    buildPhase='building';
    const perFloor = (BUILD_S-3)/FLOORS.length;
    setProgress(2,'ALAP LERAKÁSA...');
    setTimeout(()=> buildFloor(0,perFloor), 2200);
}

function buildFloor(idx, perFloor){
    if(idx>=FLOORS.length){
        setProgress(93,'ANTENNA TELEPÍTÉSE...');
        animAntenna();
        setTimeout(()=>{
            buildPhase='done';
            setProgress(100,'TORONY KÉSZ');
            setTimeout(()=>{
                document.getElementById('build-ui').classList.add('gone');
                setTimeout(()=>document.getElementById('tap-hint').classList.add('show'),600);
            },1000);
        }, 2200);
        return;
    }

    const pct=3+Math.round((idx/FLOORS.length)*88);
    setProgress(pct,`${idx+1}. EMELET  ·  ${FLOORS[idx].name}`);
    animFloorIn(idx,()=> setTimeout(()=>buildFloor(idx+1,perFloor), perFloor*180));
}

function setProgress(pct,txt){
    document.getElementById('bp-fill').style.width=pct+'%';
    document.getElementById('bp-dot').style.right=(100-pct)+'%';
    document.getElementById('bp-text').textContent=txt;
}

function animFloorIn(idx,cb){
    const fm=floorGroups[idx];
    const targetY=BASE_Y+(idx+0.5)*FH;
    fm.group.position.y=targetY+4.0; 
    fm.group.scale.set(1,0.01,1);
    fm.built=true;

    const dur=1000, t0=Date.now();
    function step(){
        const t=Math.min((Date.now()-t0)/dur,1);
        const e=easeOutBack(t); 
        
        fm.group.position.y=(targetY+4.0)*(1-e)+targetY*e;
        fm.group.scale.y=Math.max(0.01, easeOutCubic(t));
        
        if(t<1) requestAnimationFrame(step);
        else{ fm.group.position.y=targetY; fm.group.scale.set(1,1,1); if(cb) cb(); }
    }
    step();
}

function animAntenna(){
    const b=scene.getObjectByName('antBase');
    const r=scene.getObjectByName('antRod');
    const t=scene.getObjectByName('antTip');
    const g=scene.getObjectByName('antGlow');
    const dur=1600, t0=Date.now();
    function step(){
        const time=Math.min((Date.now()-t0)/dur,1);
        const e=easeOutCubic(time);
        if(b) b.material.opacity=e;
        if(r) r.material.opacity=e;
        if(t) t.material.opacity=e;
        if(g) g.material.opacity=e*0.4;
        if(time<1) requestAnimationFrame(step);
    }
    step();
}

const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{ const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

// ════════════════════════════════════════════════════════════
// PANEL NAVIGÁCIÓ
// ════════════════════════════════════════════════════════════
function buildFloorNav(){
    const nav=document.getElementById('floor-nav');
    nav.innerHTML='';
    FLOORS.forEach((d,i)=>{
        const card=document.createElement('div');
        card.className='fn-card'; card.dataset.fi=i;
        card.style.borderColor=d.col+'33';
        card.innerHTML=`<div class="fn-num" style="color:${d.col}">0${d.n}</div><div class="fn-dot" style="background:${d.col};box-shadow:0 0 8px ${d.col}"></div><div class="fn-name">${d.name}</div>`;
        card.onclick=()=>selectFloor(i);
        nav.appendChild(card);
    });
}

function selectFloor(idx){
    if(buildPhase!=='done') return;
    selectedFloor=idx;
    updateFloorHighlight();
    fillPanel(idx);
    
    if(!panelOpen){ 
        panelOpen=true; 
        document.getElementById('proj-panel').classList.add('open'); 
        document.getElementById('tap-hint').classList.remove('show'); 
        document.getElementById('modal-backdrop').classList.add('open'); 
    }
}

function navFloor(dir){
    const next=((selectedFloor+dir)+FLOORS.length)%FLOORS.length;
    selectFloor(next);
}

function closePanel(){
    panelOpen=false;
    selectedFloor=-1;
    document.getElementById('proj-panel').classList.remove('open');
    document.getElementById('modal-backdrop').classList.remove('open'); 
    document.querySelectorAll('.fn-card').forEach(c=>c.classList.remove('active'));
    setTimeout(()=>{ if(buildPhase==='done') document.getElementById('tap-hint').classList.add('show'); },600);
}

function updateFloorHighlight(){
    document.querySelectorAll('.fn-card').forEach((c,i)=>{
        c.classList.toggle('active',i===selectedFloor);
    });
    const cards=document.querySelectorAll('.fn-card');
    if(cards[selectedFloor]) cards[selectedFloor].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function fillPanel(idx){
    const d=FLOORS[idx];
    setVar('--p',d.col);
    setVar('--pg',d.col+'77');
    setVar('--pb',hexToRgba(d.col,0.15));

    document.getElementById('pp-badge').textContent=`0${d.n}`;
    document.getElementById('pp-name').textContent=d.name;
    document.getElementById('pp-name').style.textShadow=`0 0 30px ${d.col}99`;
    document.getElementById('pp-sub').textContent=d.sub;
    document.getElementById('pp-sub').style.color=d.col;
    document.getElementById('pp-desc').textContent=d.desc;

    const tech=document.getElementById('pp-tech');
    tech.innerHTML='';
    d.tech.forEach(t=>{ const tag=document.createElement('div'); tag.className='tag'; tag.textContent=t; tech.appendChild(tag); });

    d.stats.forEach((s,i)=>{ document.getElementById(`sv${i+1}`).textContent=s[0]; document.getElementById(`sl${i+1}`).textContent=s[1]; });
}

function setVar(n,v){ document.documentElement.style.setProperty(n,v); }
function hexToRgba(hex,a){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
}

// ════════════════════════════════════════════════════════════
// ANIMÁCIÓ LOOP
// ════════════════════════════════════════════════════════════
function animate(){
    requestAnimationFrame(animate);
    const t=Date.now()*.001;

    // --- KÖRNYEZET ADAPTÁCIÓ VÉGREHAJTÁSA ---
    if(t - lastSample > 0.2) { 
        lastSample = t; 
        analyzeBackground(); 
    }
    
    envBright += (targetBright - envBright) * 0.05;
    currentEnvColor.lerp(targetEnvColor, 0.05);

    if(!panelOpen) {
        const hex = '#' + currentEnvColor.getHexString();
        setVar('--p', hex);
        setVar('--pg', hex + '77');
        setVar('--pb', hexToRgba(hex, 0.15));
    }

    if(fillLight) fillLight.color.copy(currentEnvColor);
    if(scene.fog) scene.fog.color.copy(currentEnvColor).multiplyScalar(0.06);

    const invBright = Math.max(0.1, 1.0 - envBright);
    const glowFactor = 0.01 + (invBright * 0.15); 
    const glassOp = 0.6 + (envBright * 0.35); 
    
    // Névjegy Mentése Animáció (Data Burst Effect)
    let burstRotation = 0;
    let burstScale = 1.0;
    let burstGlow = 0;
    
    if (pulseAnim > 0) {
        pulseAnim -= 0.015; // Szép lassan halványul el az effekt
        if (pulseAnim < 0) pulseAnim = 0;
        
        burstRotation = pulseAnim * 2.0; // Pörgés
        burstScale = 1.0 + (pulseAnim * 0.15); // Enyhe növekedés
        burstGlow = pulseAnim * 4.0; // Erős felvillanás
    }

    // Kamera interpoláció
    cRotX+=(tRotX-cRotX)*0.06; cRotY+=(tRotY-cRotY)*0.06;
    const R=8.5; 
    camera.position.set(Math.sin(cRotY)*R, 0.5+cRotX*R*0.5, Math.cos(cRotY)*R);
    camera.lookAt(0, 1.2, 0);

    // Alapzat animációk
    const r1=scene.getObjectByName('r1'); 
    if(r1) { r1.rotation.z = t*0.2; r1.material.color.copy(currentEnvColor); }
    const r2=scene.getObjectByName('r2'); 
    if(r2) { r2.rotation.z = -t*0.3; r2.material.color.copy(currentEnvColor); }

    const ag=scene.getObjectByName('antGlow'); if(ag) ag.material.opacity=0.2+Math.sin(t*3.5)*0.2;
    const at=scene.getObjectByName('antTip');  if(at) { at.rotation.y = t; at.rotation.x = t*0.5; }

    // Emeletek
    floorGroups.forEach((fm,i)=>{
        if(!fm.built) return;
        const baseY=BASE_Y+(i+0.5)*FH;
        const isSel=(i===selectedFloor);

        fm.glassMat.opacity = THREE.MathUtils.lerp(fm.glassMat.opacity, isSel ? 0.9 : glassOp, 0.1);

        if(isSel){
            fm.glassMat.emissiveIntensity = (glowFactor * 3.5) + Math.sin(t*5)*0.15 + burstGlow; 
            fm.exScale = THREE.MathUtils.lerp(fm.exScale, 1.15, 0.06); 
            fm.exY = THREE.MathUtils.lerp(fm.exY, 0.25, 0.06); 
        } else {
            fm.glassMat.emissiveIntensity = glowFactor + Math.sin(t*1.5+i)*0.015 + burstGlow;
            fm.exScale = THREE.MathUtils.lerp(fm.exScale, 1.0, 0.08);
            fm.exY = THREE.MathUtils.lerp(fm.exY, 0.0, 0.08);
        }
        
        fm.group.scale.set(fm.exScale, 1, fm.exScale);
        fm.group.position.y = baseY + fm.exY;
        
        fm.lightGroup.children.forEach((light, lIdx) => {
            light.material.opacity = (isSel ? 1.0 : (0.2 + invBright*0.6)) + Math.sin(t * (2+lIdx%3) + lIdx) * 0.3;
        });
    });

    if(towerGroup) {
        towerGroup.position.y = Math.sin(t*0.5)*0.05 + (pulseAnim * 0.1); // Torony felugrik kicsit
        towerGroup.rotation.y = burstRotation; // Torony megpördül
        towerGroup.scale.set(burstScale, burstScale, burstScale); // Torony kitágul
    }

    renderer.render(scene,camera);
}

// ════════════════════════════════════════════════════════════
// TOUCH + RAYCASTER
// ════════════════════════════════════════════════════════════
function onTap(x,y){
    if(buildPhase!=='done' || panelOpen) return;
    mouse.x=(x/window.innerWidth)*2-1;
    mouse.y=-(y/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const meshes=floorGroups.filter(f=>f.built).map(f=>f.glass);
    const hits=raycaster.intersectObjects(meshes,false);
    if(hits.length>0){
        const fi=hits[0].object.userData.fi;
        if(fi!==undefined) selectFloor(fi);
    }
}

const canvasEl = document.getElementById('ar-canvas');

canvasEl.addEventListener('touchstart',e=>{
    touchMoved=false;
    if(e.touches.length===1){ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; }
},{passive:true});

canvasEl.addEventListener('touchmove',e=>{
    touchMoved=true;
    if(e.touches.length===1&&!gyroAvail){
        tRotY+=(e.touches[0].clientX-touchX)*.005;
        tRotX+=(-e.touches[0].clientY+touchY)*.004;
        touchX=e.touches[0].clientX; touchY=e.touches[0].clientY;
    }
},{passive:true});

canvasEl.addEventListener('touchend',e=>{
    if(!touchMoved&&e.changedTouches.length===1){
        onTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
    }
},{passive:true});

canvasEl.addEventListener('click',e=>{
    onTap(e.clientX,e.clientY);
});

// ════════════════════════════════════════════════════════════
// GYRO
// ════════════════════════════════════════════════════════════
function setupGyro(){
    if(typeof DeviceOrientationEvent==='undefined') return;
    const en=()=>{
        window.addEventListener('deviceorientation',e=>{
            if(e.beta===null) return; gyroAvail=true;
            tRotX=THREE.MathUtils.clamp((e.beta-72)*.012,-.8,.8);
            tRotY=THREE.MathUtils.clamp(e.gamma*.02,-Math.PI,Math.PI);
        });
    };
    if(typeof DeviceOrientationEvent.requestPermission==='function')
        DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') en(); }).catch(()=>{});
    else en();
}
