    <style>
        *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body{ background:#050d1a; width:100vw; height:100vh; overflow:hidden; font-family: sans-serif; }
        
        /* Kamera háttér a Fallback (iOS) módhoz */
        #camera-bg{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; }

            clip-path:polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%); transition:all 0.3s;
            box-shadow: 0 0 25px rgba(0,207,255,0.4);
        }
        #start-btn:active{ transform:scale(0.95); }
        
        /* ════ CSS VARS ════ */
        :root{ --p: #00cfff; --s: #0044ff; --a: #ff0066; --pg: #00cfff66; --pb: rgba(0,207,255,0.08); }

        /* ════ HUD ════ */

        .c-tr{ top:20px; right:20px; border-width:2px 2px 0 0; }
        .c-bl{ bottom:20px; left:20px; border-width:0 0 2px 2px; }

        /* NÉVJEGY PANEL */
        #namecard{

            font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:2px; font-weight:bold;

        .sbox{ text-align:center; padding:12px 4px; border:1px solid #ffffff15; background:rgba(255,255,255,0.02); clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }

            font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; letter-spacing: 5px;

        #pp-close-btn-large:active { background: rgba(255,255,255,0.15); border-color: #fff; }

<script>
// ════════════════════════════════════════════════════════════
// PROJEKT ADATOK
// ════════════════════════════════════════════════════════════
const FLOORS = [

    { n:4, name:'PHARMA-PRED', sub:'Gyógyszerhatás előrejelző', desc:'Mellékhatás és gyógyszerkölcsönhatás predikció LLM-mel...', tech:['LangChain','GPT-4','RDKit','FastAPI'], stats:[['10k+','VEGYÜLET'],['87%','PREDIKCIÓ'],['2024','LAUNCH']], col:'#ffaa00', hex:0xffaa00 },
    { n:5, name:'CLINIC-BOT', sub:'Orvosi LLM asszisztens', desc:'Klinikai dokumentáció automatizálás finomhangolt LLaMA modellel...', tech:['LLaMA','RAG','ChromaDB','Docker'], stats:[['50k','PUBLIKÁCIÓ'],['92%','ELÉGEDETTSÉG'],['On-prem','DEPLOY']], col:'#00ccff', hex:0x00ccff },

];

// ════════════════════════════════════════════════════════════
// ÁLLAPOT VÁLTOZÓK (Hibrid AR Rendszer)
// ════════════════════════════════════════════════════════════
let scene, camera, renderer, raycaster, mouse;
let isWebXRMode = false;

// WebXR specifikus
let controller, reticle, hitTestSource = null, hitTestSourceRequested = false;

// Fallback (Magic Window) specifikus
let gyroAvail=false, tRotX=0, tRotY=0, cRotX=0, cRotY=0;
let touchX=0, touchY=0, touchMoved=false;

let worldGroup; 
let towerGroup, floorGroups=[];

let pulseAnim = 0; 

// Épület belső dimenziók
const FH=0.65, FW=1.4, BASE_Y=0.0; 
const AR_SCALE = 0.15; 
const BUILD_S=12; 

// ════════════════════════════════════════════════════════════
// NÉVJEGY LETÖLTÉS (vCard)
// ════════════════════════════════════════════════════════════
function saveContact() {
    const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Kovács AI-Gábor\nORG:Neural Architect\nTITLE:Lead AI Engineer\nTEL;TYPE=WORK,VOICE:+36123456789\nEMAIL:ai@kovacs.dev\nURL:https://github.com/kovacs-ai\nNOTE:Hibrid AR Portfólióból mentve\nEND:VCARD`;
    const blob = new Blob([vcardData], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Kovacs_AI_Gabor.vcf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const btn = document.getElementById('btn-contact');
    const orig = btn.innerHTML;
    btn.innerHTML = "✓ MENTVE"; btn.style.background = "#fff"; btn.style.color = "#000";
    setTimeout(() => { btn.innerHTML = orig; btn.style.background = ""; btn.style.color = ""; }, 2500);

    pulseAnim = 1.0; 
}

// ════════════════════════════════════════════════════════════
// HIBRID AR INDÍTÁSA (A "Varázslat" itt történik)
// ════════════════════════════════════════════════════════════
async function startAR() {
    let xrSupported = false;
    
    // Ellenőrizzük, hogy a böngésző natívan támogatja-e a padló-felismerős AR-t (Pl. Android Chrome)
    if ('xr' in navigator) {
        xrSupported = await navigator.xr.isSessionSupported('immersive-ar');
    }

    if (xrSupported) {
        // --- 1. ÚT: IGAZI WEBXR (Hit Test, 6DOF) ---
        isWebXRMode = true;
        document.getElementById('ar-mode-badge').innerHTML = "WebXR <b>AKTÍV</b>";
        try {
            const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test', 'dom-overlay'],
                domOverlay: { root: document.getElementById('dom-overlay-root') }
            });
            initThreeBase();
            initWebXRSpecifics(session);
        } catch (err) {
            // Ha a felhasználó mégis elutasítja a WebXR engedélyt, visszaesünk a Fallback-re
            startFallbackAR();
        }
    } else {
        // --- 2. ÚT: FALLBACK MÓD (iOS Safari / Magic Window) ---
        isWebXRMode = false;
        document.getElementById('ar-mode-badge').innerHTML = "Kamera AR <b>AKTÍV</b>";
        startFallbackAR();
    }
}

async function startFallbackAR() {
    try {
        // Kamera videó stream bekérése kézzel
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        const videoEl = document.getElementById('camera-bg');
        videoEl.srcObject = stream;
        videoEl.style.display = 'block'; // Megjelenítjük a videót a canvas alatt

        initThreeBase();
        initFallbackSpecifics();

    } catch (err) {
        alert("Kérlek engedélyezd a kamerát a böngésző beállításaiban az AR élményhez!");
    }
}

// ════════════════════════════════════════════════════════════
// THREE.JS ALAPOK (Közös mindkét módnál)
// ════════════════════════════════════════════════════════════
function initThreeBase() {
    const canvas = document.getElementById('ar-canvas');
    renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffddaa, 1.2);
    dirLight.position.set(1, 4, 2);
    scene.add(dirLight);

    worldGroup = new THREE.Group();
    worldGroup.scale.set(AR_SCALE, AR_SCALE, AR_SCALE); 
    scene.add(worldGroup);

    towerGroup = new THREE.Group();
    worldGroup.add(towerGroup);

    buildGround();
    buildCinematicFloors();

    buildFloorNav();
    document.getElementById('splash').classList.add('hidden');
    setTimeout(()=>document.getElementById('splash').style.display='none', 1000);
    document.getElementById('hud').classList.add('visible');
    setInterval(()=>{ const e=document.getElementById('sb-clock'); if(e) e.textContent=new Date().toTimeString().slice(0,5); },1000);

    window.addEventListener('resize', onWindowResize, false);
}

// ════════════════════════════════════════════════════════════
// WEBXR SPECIFIKUS INIT
// ════════════════════════════════════════════════════════════
function initWebXRSpecifics(session) {
    renderer.xr.enabled = true;
    worldGroup.visible = false; // Elrejtjük, amíg le nem rakják

    const reticleGeo = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00cfff, transparent:true, opacity: 0.8 });
    reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelectWebXR);
    scene.add(controller);

    renderer.xr.setReferenceSpaceType('local');
    renderer.xr.setSession(session);
    renderer.setAnimationLoop(renderLoop);
}

// ════════════════════════════════════════════════════════════
// FALLBACK SPECIFIKUS INIT (iOS)
// ════════════════════════════════════════════════════════════
function initFallbackSpecifics() {
    raycaster = new THREE.Raycaster(); 
    mouse = new THREE.Vector2();

    // A tornyot fixen a kamera elé tesszük, kicsit lejjebb
    worldGroup.position.set(0, -0.6, -2.5);
    worldGroup.scale.set(AR_SCALE * 1.5, AR_SCALE * 1.5, AR_SCALE * 1.5); 
    worldGroup.visible = true;

    // Giroszkóp beállítása
    setupGyroFallback();

    // UI Szöveg cseréje, mivel itt nincs letétel
    document.getElementById('tap-hint').classList.remove('show');
    
    // Rögtön indulhat az építés
    startBuild();

    // Érintés események a Fallback Raycastinghez
    const domOverlay = document.getElementById('dom-overlay-root');
    domOverlay.addEventListener('touchstart', e => { touchMoved=false; if(e.touches.length===1){ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; } },{passive:true});
    domOverlay.addEventListener('touchmove', e => { 
        touchMoved=true; 
        if(e.touches.length===1 && !gyroAvail){
            tRotY += (e.touches[0].clientX - touchX) * 0.005;
            tRotX += (-e.touches[0].clientY + touchY) * 0.004;
            touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
        }
    },{passive:true});
    domOverlay.addEventListener('touchend', e => {
        if(!touchMoved && e.changedTouches.length===1){
            onSelectFallback(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
    },{passive:true});
    domOverlay.addEventListener('click', e => {
        // Ne fusson le, ha gombra kattintottunk
        if(e.target.closest('.act-btn') || e.target.closest('#pp-close-btn-large')) return;
        onSelectFallback(e.clientX, e.clientY);
    });

    renderer.setAnimationLoop(renderLoop);
}

function setupGyroFallback(){
    if(typeof DeviceOrientationEvent==='undefined') return;
    const en=()=>{
        window.addEventListener('deviceorientation',e=>{
            if(e.beta===null) return; gyroAvail=true;
            tRotX = THREE.MathUtils.clamp((e.beta-72)*.012, -.8, .8);
            tRotY = THREE.MathUtils.clamp(e.gamma*.02, -Math.PI, Math.PI);
        });
    };
    if(typeof DeviceOrientationEvent.requestPermission==='function')
        DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') en(); }).catch(()=>{});
    else en();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ════════════════════════════════════════════════════════════
// INTERAKCIÓ: WEBXR
// ════════════════════════════════════════════════════════════
function onSelectWebXR() {
    if (panelOpen) return; 
    if (buildPhase === 'scanning') {
        if (reticle.visible) {
            worldGroup.position.setFromMatrixPosition(reticle.matrix);
            worldGroup.visible = true;
            reticle.visible = false;
            document.getElementById('tap-hint').classList.remove('show');
            startBuild(); 
        }
    } 
    else if (buildPhase === 'done') {
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        const raycaster = new THREE.Raycaster();
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const meshes = floorGroups.filter(f => f.built).map(f => f.glass);
        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length > 0) {
            const fi = hits[0].object.userData.fi;
            if (fi !== undefined) selectFloor(fi);
        }
    }
}

// ════════════════════════════════════════════════════════════
// INTERAKCIÓ: FALLBACK MÓD
// ════════════════════════════════════════════════════════════
function onSelectFallback(x, y) {
    if (panelOpen || buildPhase !== 'done') return; 
    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const meshes = floorGroups.filter(f => f.built).map(f => f.glass);
    const hits = raycaster.intersectObjects(meshes, false);
    if (hits.length > 0) {
        const fi = hits[0].object.userData.fi;
        if (fi !== undefined) selectFloor(fi);
    }
}


// ════════════════════════════════════════════════════════════
// ÉPÜLET GENERÁLÁS (Közös)
// ════════════════════════════════════════════════════════════
function buildGround(){
    const baseGeo = new THREE.CylinderGeometry(3, 3, 0.05, 32);
    const baseMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.9, metalness: 0.2});
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = BASE_Y - 0.025; 
    worldGroup.add(baseMesh);

    const r1 = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.015, 16, 100), new THREE.MeshBasicMaterial({color:0x00cfff, transparent:true, opacity:0.8}));
    r1.rotation.x = Math.PI/2; r1.position.y = BASE_Y + 0.01; r1.name='r1'; worldGroup.add(r1);
    
    const r2 = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.005, 16, 100), new THREE.MeshBasicMaterial({color:0x0044ff, transparent:true, opacity:0.4}));
    r2.rotation.x = Math.PI/2; r2.position.y = BASE_Y + 0.01; r2.name='r2'; worldGroup.add(r2);
}

function buildCinematicFloors(){
    const gap = 0.05; 
    const actualFH = FH - gap;

    const slabMat = new THREE.MeshStandardMaterial({color: 0x2a2a2a, metalness: 0.7, roughness: 0.6}); 
    const coreMat = new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8, roughness: 0.8}); 
    const pillarMat = new THREE.MeshStandardMaterial({color: 0x1a1a1a, metalness: 0.9, roughness: 0.4}); 

    FLOORS.forEach((data,i)=>{
        const group=new THREE.Group();
        const radius = FW * Math.pow(0.92, i);
        
        group.position.set(0, BASE_Y + gap + (i + 0.5) * FH, 0);
        group.scale.set(1,0.001,1); 

        const slabGeo = new THREE.CylinderGeometry(radius, radius, 0.08, 16);
        const slab = new THREE.Mesh(slabGeo, slabMat);
        slab.position.y = -actualFH/2 + 0.04;
        group.add(slab);

        const glassRadius = radius * 0.88;
        const glassGeo = new THREE.CylinderGeometry(glassRadius, glassRadius, actualFH - 0.08, 16);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x02050a, emissive: new THREE.Color(data.hex), emissiveIntensity: 0.8, 
            metalness: 0.9, roughness: 0.05, clearcoat: 1.0, transparent: true, opacity: 0.9
        });
        const glass=new THREE.Mesh(glassGeo, glassMat);
        group.add(glass);
        glass.userData={fi:i}; 

        const coreGeo = new THREE.CylinderGeometry(radius*0.35, radius*0.35, actualFH, 8);
        const core = new THREE.Mesh(coreGeo, coreMat);
        group.add(core);

        for(let w=1; w<=3; w++){
            const hFrameGeo = new THREE.TorusGeometry(glassRadius, 0.012, 8, 32);
            const hFrame = new THREE.Mesh(hFrameGeo, pillarMat);
            hFrame.rotation.x = Math.PI/2;
            hFrame.position.y = -actualFH/2 + (actualFH/4)*w;
            group.add(hFrame);
        }

        const pillarCount = 8;
        for(let p=0; p<pillarCount; p++){
            const ang = (p/pillarCount)*Math.PI*2 + (i%2===0 ? 0 : Math.PI/pillarCount); 
            const pGeo = new THREE.CylinderGeometry(0.025, 0.025, actualFH, 8);
            const pillar = new THREE.Mesh(pGeo, pillarMat);
            pillar.position.set(Math.cos(ang)*radius*0.96, 0, Math.sin(ang)*radius*0.96);
            group.add(pillar);
        }

        const ringGeo = new THREE.CylinderGeometry(radius*0.95, radius*0.95, gap*0.6, 32);
        const stripMat = new THREE.MeshBasicMaterial({color:data.hex, transparent:true, opacity:0.9, blending: THREE.AdditiveBlending});
        const strip = new THREE.Mesh(ringGeo, stripMat);
        strip.position.y = -actualFH/2 - gap/2;
        group.add(strip);

        const lightGroup = new THREE.Group();
        for(let l=0; l<18; l++){
            const lGeo = new THREE.BoxGeometry(0.04, 0.02, 0.02);
            const lMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent:true, opacity: 0});
            const light = new THREE.Mesh(lGeo, lMat);
            const a = Math.random() * Math.PI * 2;
            light.position.set(Math.cos(a)*glassRadius, (Math.random()-0.5)*actualFH*0.8, Math.sin(a)*glassRadius);
            light.rotation.y = -a;
            light.userData = { currentOpacity: 0, phase: Math.random() * Math.PI * 2, speed: 1 + Math.random() * 2 };
            lightGroup.add(light);
        }
        group.add(lightGroup);

        towerGroup.add(group);
        floorGroups.push({group, glass, glassMat, stripMat, lightGroup, data, built:false, exScale:1, exY:0});
    });

    buildAntenna();
}

function buildAntenna(){
    const gap = 0.05;
    const topY=BASE_Y + gap + FLOORS.length*FH; 
    const rTop = FW * Math.pow(0.92, FLOORS.length);
    
    const base = new THREE.Mesh(new THREE.CylinderGeometry(rTop*0.2, rTop*0.6, 0.3, 16), new THREE.MeshStandardMaterial({color:0x222222, metalness:0.8, roughness:0.5}));
    base.position.set(0, topY + 0.15, 0); base.name='antBase'; towerGroup.add(base);

    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.02, 2.0, 8),new THREE.MeshStandardMaterial({color:0x88ccff, metalness:1, roughness:0.2}));
    rod.position.set(0,topY + 1.1,0); rod.name='antRod'; towerGroup.add(rod);

    const tip=new THREE.Mesh(new THREE.OctahedronGeometry(0.08),new THREE.MeshBasicMaterial({color:0x00cfff, wireframe:true}));
    tip.position.set(0,topY + 2.2,0); tip.name='antTip'; towerGroup.add(tip);

    const glow=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,16),new THREE.MeshBasicMaterial({color:0x00cfff,transparent:true,opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false}));
    glow.position.copy(tip.position); glow.name='antGlow'; towerGroup.add(glow);
}

// ════════════════════════════════════════════════════════════
// BUILD ANIMÁCIÓ (Közös)
// ════════════════════════════════════════════════════════════
function startBuild(){
    buildPhase='building';
    document.getElementById('build-ui').classList.add('building');
    const perFloor = (BUILD_S-3)/FLOORS.length;
    setProgress(2,'KÖRNYEZETI MAPPING...');
    setTimeout(()=> buildFloor(0,perFloor), 1000);
}

function buildFloor(idx, perFloor){
    if(idx>=FLOORS.length){
        setProgress(93,'ANTENNA TELEPÍTÉSE...');
        setTimeout(()=>{
            buildPhase='done';
            setProgress(100,'TORONY KÉSZ');
            setTimeout(()=>{
                document.getElementById('build-ui').classList.remove('building');
                document.getElementById('tap-hint').textContent = "// KOPPINTS EGY EMELETRE //";
                document.getElementById('tap-hint').classList.add('show');
            },1500);
        }, 1500);
        return;
    }

    const pct=3+Math.round((idx/FLOORS.length)*88);
    setProgress(pct,`${idx+1}. EMELET  ·  ${FLOORS[idx].name}`);
    animFloorIn(idx,()=> setTimeout(()=>buildFloor(idx+1,perFloor), perFloor*180));
}

function setProgress(pct,txt){
    document.getElementById('bp-fill').style.width=pct+'%';
    document.getElementById('bp-text').textContent=txt;
}

function animFloorIn(idx,cb){
    const fm=floorGroups[idx];
    const targetY=BASE_Y+(idx+0.5)*FH;
    fm.group.position.y=targetY+2.0; 
    fm.group.scale.set(1,0.01,1);
    fm.built=true;

    const dur=800, t0=Date.now();
    function step(){
        const t=Math.min((Date.now()-t0)/dur,1);
        const e=easeOutBack(t); 
        
        fm.group.position.y=(targetY+2.0)*(1-e)+targetY*e;
        fm.group.scale.y=Math.max(0.01, easeOutCubic(t));
        
        if(t<1) requestAnimationFrame(step);
        else{ fm.group.position.y=targetY; fm.group.scale.set(1,1,1); if(cb) cb(); }
    }
    step();
}

const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{ const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

// ════════════════════════════════════════════════════════════
// PANEL NAVIGÁCIÓ (UI)
// ════════════════════════════════════════════════════════════
function buildFloorNav(){
    const nav=document.getElementById('floor-nav');
    nav.innerHTML='';
    FLOORS.forEach((d,i)=>{
        const card=document.createElement('div');
        card.className='fn-card'; card.dataset.fi=i;
        card.style.borderColor=d.col+'33';
        card.innerHTML=`<div class="fn-num" style="color:${d.col}">0${d.n}</div><div class="fn-dot" style="background:${d.col};box-shadow:0 0 8px ${d.col}"></div><div class="fn-name">${d.name}</div>`;
        card.onclick=()=>selectFloor(i);
        nav.appendChild(card);
    });
}

function selectFloor(idx){
    if(buildPhase!=='done') return;
    selectedFloor=idx;
    document.querySelectorAll('.fn-card').forEach((c,i)=> c.classList.toggle('active',i===selectedFloor));
    const cards=document.querySelectorAll('.fn-card');
    if(cards[selectedFloor]) cards[selectedFloor].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    
    fillPanel(idx);
    
    if(!panelOpen){ 
        panelOpen=true; 
        document.getElementById('proj-panel').classList.add('open'); 
        document.getElementById('tap-hint').classList.remove('show'); 
        document.getElementById('modal-backdrop').classList.add('open'); 
    }
}

function navFloor(dir){
    const next=((selectedFloor+dir)+FLOORS.length)%FLOORS.length;
    selectFloor(next);
}

function closePanel(){
    panelOpen=false;
    selectedFloor=-1;
    document.getElementById('proj-panel').classList.remove('open');
    document.getElementById('modal-backdrop').classList.remove('open'); 
    document.querySelectorAll('.fn-card').forEach(c=>c.classList.remove('active'));
    setTimeout(()=>{ if(buildPhase==='done') document.getElementById('tap-hint').classList.add('show'); },600);
}

function fillPanel(idx){
    const d=FLOORS[idx];
    document.documentElement.style.setProperty('--p',d.col);
    document.documentElement.style.setProperty('--pg',d.col+'77');

    document.getElementById('pp-badge').textContent=`0${d.n}`;
    document.getElementById('pp-name').textContent=d.name;
    document.getElementById('pp-sub').textContent=d.sub;
    document.getElementById('pp-sub').style.color=d.col;
    document.getElementById('pp-desc').textContent=d.desc;

    const tech=document.getElementById('pp-tech');
    tech.innerHTML='';
    d.tech.forEach(t=>{ const tag=document.createElement('div'); tag.className='tag'; tag.textContent=t; tech.appendChild(tag); });

    d.stats.forEach((s,i)=>{ document.getElementById(`sv${i+1}`).textContent=s[0]; document.getElementById(`sl${i+1}`).textContent=s[1]; });
}

// ════════════════════════════════════════════════════════════
// RENDER LOOP (Minden képkocka frissítése)
// ════════════════════════════════════════════════════════════
function renderLoop(timestamp, frame){
    const t = timestamp * 0.001;

    // --- KIZÁRÓLAG WEBXR MÓDBAN (HIT TEST) ---
    if (isWebXRMode && frame && buildPhase === 'scanning') {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then((refSpace) => {
                session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
            });
            session.addEventListener('end', () => { hitTestSourceRequested = false; hitTestSource = null; });
            hitTestSourceRequested = true;
        }

        if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                reticle.visible = true;
                reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                
                const hint = document.getElementById('tap-hint');
                if(hint.textContent !== "// KOPPINTS A LERAKÁSHOZ //") {
                    hint.textContent = "// KOPPINTS A LERAKÁSHOZ //";
                    hint.style.borderColor = "#00ffaa"; hint.style.color = "#00ffaa";
                }
            } else {
                reticle.visible = false;
            }
        }
    }

    // --- KIZÁRÓLAG FALLBACK MÓDBAN (KAMERA MOZGATÁSA GIROSZKÓPPAL) ---
    if (!isWebXRMode) {
        cRotX += (tRotX - cRotX) * 0.06; 
        cRotY += (tRotY - cRotY) * 0.06;
        const R = 3.5; // Távolság a modelltől a Fallback nézetben
        // Mozgatjuk a kamerát a világ körül
        camera.position.set(Math.sin(cRotY) * R, 0.5 + cRotX * R, Math.cos(cRotY) * R);
        camera.lookAt(0, 0, -2.5); // A világ közepe felé nézünk
    }

    // --- KÖZÖS ANIMÁCIÓK ---
    
    // Névjegy Mentése Animáció (Data Burst)
    let burstRotation = 0, burstScale = 1.0, burstGlow = 0;
    if (pulseAnim > 0) {
        pulseAnim -= 0.02; if (pulseAnim < 0) pulseAnim = 0;
        burstRotation = pulseAnim * 2.0; 
        burstScale = 1.0 + (pulseAnim * 0.1); 
        burstGlow = pulseAnim * 3.0; 
    }

    const r1=worldGroup.getObjectByName('r1'); if(r1) r1.rotation.z = t*0.2; 
    const r2=worldGroup.getObjectByName('r2'); if(r2) r2.rotation.z = -t*0.3; 
    const ag=towerGroup.getObjectByName('antGlow'); if(ag) ag.material.opacity=0.4+Math.sin(t*3.5)*0.2;
    const at=towerGroup.getObjectByName('antTip');  if(at) { at.rotation.y = t; at.rotation.x = t*0.5; }

    floorGroups.forEach((fm,i)=>{
        if(!fm.built) return;
        const baseY=BASE_Y+(i+0.5)*FH;
        const isSel=(i===selectedFloor);

        if(isSel){
            fm.glassMat.emissiveIntensity = 2.0 + Math.sin(t*5)*0.5 + burstGlow; 
            fm.exScale = THREE.MathUtils.lerp(fm.exScale, 1.12, 0.1); 
            fm.exY = THREE.MathUtils.lerp(fm.exY, 0.15, 0.1); 
        } else {
            fm.glassMat.emissiveIntensity = 0.5 + Math.sin(t*1.5+i)*0.1 + burstGlow; 
            fm.exScale = THREE.MathUtils.lerp(fm.exScale, 1.0, 0.1);
            fm.exY = THREE.MathUtils.lerp(fm.exY, 0.0, 0.1);
        }
        
        fm.group.scale.set(fm.exScale, 1, fm.exScale);
        fm.group.position.y = baseY + fm.exY;
        
        fm.lightGroup.children.forEach((light, lIdx) => {
            light.material.opacity = isSel ? 1.0 : (0.6 + Math.sin(t * (2+lIdx%3) + lIdx) * 0.4);
        });
    });

    if(towerGroup) {
        towerGroup.position.y = Math.sin(t*0.5)*0.02 + (pulseAnim * 0.05); 
        towerGroup.rotation.y = burstRotation; 
        towerGroup.scale.set(burstScale, burstScale, burstScale); 
    }

    renderer.render(scene, camera);
}
