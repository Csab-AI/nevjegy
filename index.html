<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KOVÁCS AI-GÁBOR // AR NÉVJEGY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Share Tech Mono', monospace; touch-action: none; }

        #camera-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 0;
        }
        #ar-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }

        /* SPLASH */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
            transition: opacity 0.8s ease;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }
        .splash-logo {
            font-family: 'Orbitron', sans-serif; font-size: clamp(24px, 7vw, 40px); font-weight: 900;
            color: #00ffcc; text-align: center; letter-spacing: 5px;
            text-shadow: 0 0 30px #00ffcc, 0 0 80px #00ffcc44;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc44; }
            to   { text-shadow: 0 0 50px #00ffcc, 0 0 100px #00ffcc88; }
        }
        .splash-sub { font-size: 10px; color: #ffffff33; letter-spacing: 4px; text-align: center; }
        #start-btn {
            font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 4px;
            color: #000; background: #00ffcc; border: none; padding: 18px 44px;
            cursor: pointer; text-transform: uppercase; position: relative; overflow: hidden;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }
        #start-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, #fff6, transparent);
            transform: translateX(-100%); animation: shimmer 2s infinite;
        }
        @keyframes shimmer { to { transform: translateX(200%); } }
        .perm-note { font-size: 9px; color: #ffffff22; letter-spacing: 2px; text-align: center; max-width: 240px; line-height: 2; }

        /* HUD */
        #hud {
            position: fixed; inset: 0; z-index: 20; pointer-events: none;
            opacity: 0; transition: opacity 1s ease 0.5s;
        }
        #hud.visible { opacity: 1; }

        .corner { position: absolute; width: 22px; height: 22px; border-style: solid; border-color: #00ffcc; opacity: 0.65; }
        .c-tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; }
        .c-tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; }
        .c-bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; }
        .c-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }

        #scanline {
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            box-shadow: 0 0 8px #00ffcc;
            animation: scan 5s linear infinite; opacity: 0.4;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #top-status {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; align-items: center;
        }
        .stat { font-size: 9px; letter-spacing: 2px; color: #ffffff44; }
        .stat b { color: #00ffcc; }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: #00ffcc; box-shadow: 0 0 6px #00ffcc; animation: blink 1.5s step-start infinite; }
        @keyframes blink { 50% { opacity: 0.1; } }

        /* BUTTONS */
        #action-bar {
            position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; pointer-events: all;
        }
        .action-btn {
            font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px;
            border: 1px solid; padding: 10px 14px; cursor: pointer; text-transform: uppercase;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
            transition: filter 0.2s;
        }
        .action-btn:active { filter: brightness(1.8); transform: scale(0.96); }
        .btn-cyan   { color: #00ffcc; border-color: #00ffcc55; background: #00ffcc16; }
        .btn-purple { color: #8a2be2; border-color: #8a2be255; background: #8a2be216; }
        .btn-red    { color: #ff0055; border-color: #ff005555; background: #ff005516; }

        /* INFO PANEL */
        #info-panel {
            position: absolute; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            background: rgba(0,10,20,0.85);
            padding: 18px 28px; min-width: 270px; max-width: 88vw; text-align: center;
            clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; border: 1px solid #00ffcc33;
        }
        #info-panel.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #info-title { font-family: 'Orbitron', sans-serif; font-size: 10px; color: #00ffcc; letter-spacing: 4px; margin-bottom: 10px; }
        #info-body  { font-size: 11px; color: #ffffffbb; letter-spacing: 1px; line-height: 1.9; }

        /* ERROR */
        #error-msg {
            position: fixed; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            z-index: 2000; background: #000000ee; padding: 32px; text-align: center;
        }
        #error-msg.show { display: flex; }
        #error-msg h2 { font-family: 'Orbitron', sans-serif; color: #ff0055; font-size: 16px; letter-spacing: 3px; }
        #error-msg p  { color: #ffffff66; font-size: 11px; letter-spacing: 2px; line-height: 2; max-width: 300px; }
        #error-msg code { color: #ff005588; font-size: 10px; display: block; margin-top: 8px; }
    </style>
</head>
<body>

<video id="camera-bg" autoplay muted playsinline></video>
<canvas id="ar-canvas"></canvas>

<div id="hud">
    <div id="scanline"></div>
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>
    <div id="top-status">
        <div class="dot"></div>
        <div class="stat">AR <b>AKTÍV</b></div>
        <div class="stat">CAM <b>HÁTSÓ</b></div>
        <div class="stat" id="clock">--:--</div>
        <div class="stat" id="adapt-mode" style="transition:color 1s ease;">CYBER MODE</div>
        <div class="dot"></div>

    </div>
    <div id="action-bar">
        <button class="action-btn btn-red"    onclick="showInfo('PORTFÓLIÓ','Egészségügyi AI projektek\nKórházi diagnózis rendszerek\nGenomika · MRI analízis\ngithub.com/kovacs-ai')">◈ PORTFÓLIÓ</button>
        <button class="action-btn btn-cyan"   onclick="showInfo('KAPCSOLAT','ai@kovacs.dev\n+36 XX XXX XXXX\nLinkedIn: kovacs-ai-gabor\nBudapest, HU')">⬡ KAPCSOLAT</button>
        <button class="action-btn btn-purple" onclick="showInfo('GITHUB','47 repository\nNeurális hálózatok\nPython · PyTorch · LangChain\ngithub.com/kovacs-ai')">◻ GITHUB</button>
    </div>
</div>

<div id="splash">
    <div class="splash-logo">KOVÁCS<br>AI-GÁBOR</div>
    <div class="splash-sub">// LEAD AI ENGINEER · NEURAL ARCHITECT //</div>
    <button id="start-btn" onclick="startAR()">⬡ AR NÉVJEGY INDÍTÁSA</button>
    <div class="perm-note">Kamera hozzáférés szükséges.<br>Semmi nem kerül tárolásra.</div>
</div>

<div id="error-msg">
    <h2>// KAMERA HIBA</h2>
    <p>Engedélyezd a kamerát a böngésző beállításokban, majd töltsd újra az oldalt.<br><br>
    iOS: Beállítások → Safari → Kamera → Engedélyezés</p>
    <code id="err-detail"></code>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, hologramGroup, ringGroup;
let targetRotX=0, targetRotY=0, currentRotX=0, currentRotY=0;
let gyroAvailable=false, touchStartX=0, touchStartY=0;
let infoTimer=null;

// ── INDÍTÁS ──
async function startAR() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
        });
        const video = document.getElementById('camera-bg');
        video.srcObject = stream;

        // Háttérelemző canvas
        window._sampleCanvas = document.createElement('canvas');
        window._sampleCanvas.width = 64;
        window._sampleCanvas.height = 36;
        window._sampleCtx = window._sampleCanvas.getContext('2d', {willReadFrequently: true});

        setupGyro();
        initThree();
        animate();

        document.getElementById('hud').classList.add('visible');
        const splash = document.getElementById('splash');
        splash.classList.add('hidden');
        setTimeout(() => splash.style.display = 'none', 900);

        setInterval(() => {
            const el = document.getElementById('clock');
            if (el) el.textContent = new Date().toTimeString().slice(0,5);
        }, 1000);

    } catch(err) {
        document.getElementById('err-detail').textContent = err.name + ': ' + err.message;
        document.getElementById('error-msg').classList.add('show');
        document.getElementById('splash').style.display = 'none';
    }
}

// ── THREE.JS ──
function initThree() {
    const canvas = document.getElementById('ar-canvas');
    const W = window.innerWidth, H = window.innerHeight;

    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: false });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    scene  = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 100);
    camera.position.set(0, 0, 5);

    scene.add(new THREE.AmbientLight(0x112233, 0.9));
    const l1 = new THREE.PointLight(0x00ffcc, 2, 12); l1.position.set(-2, 2, 3); scene.add(l1);
    const l2 = new THREE.PointLight(0x8a2be2, 1.5, 10); l2.position.set(2, -1, 2); scene.add(l2);

    hologramGroup = new THREE.Group();
    scene.add(hologramGroup);

    buildHologram();
    buildParticles();

    window.addEventListener('resize', () => {
        const W = window.innerWidth, H = window.innerHeight;
        camera.aspect = W/H; camera.updateProjectionMatrix();
        renderer.setSize(W, H);
    });
}

function buildHologram() {
    // ── Gyűrűk ──
    ringGroup = new THREE.Group();
    hologramGroup.add(ringGroup);

    const r1 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.014, 16, 120),
        new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
    r1.rotation.x = Math.PI/2;

    const r2 = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.009, 16, 100),
        new THREE.MeshBasicMaterial({ color: 0x8a2be2, transparent: true, opacity: 0.38, side: THREE.DoubleSide }));
    r2.rotation.x = Math.PI*0.4; r2.rotation.z = Math.PI*0.2;

    const r3 = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.007, 16, 80),
        new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.28, side: THREE.DoubleSide }));
    r3.rotation.y = Math.PI*0.3;

    ringGroup.add(r1, r2, r3);
    // Regisztráció adaptív rendszerbe
    window._adaptMats.push({mat: r1.material, role:'primary'});
    window._adaptMats.push({mat: r2.material, role:'secondary'});
    window._adaptMats.push({mat: r3.material, role:'accent'});

    // Tick jelek
    for (let i=0; i<24; i++) {
        const ang = (i/24)*Math.PI*2;
        const seg = new THREE.Mesh(
            new THREE.BoxGeometry(0.04, 0.001, i%6===0 ? 0.16 : 0.07),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: i%6===0 ? 0.9 : 0.35 })
        );
        seg.position.set(Math.cos(ang)*2.2, 0, Math.sin(ang)*2.2);
        seg.lookAt(0,0,0); seg.rotation.y += Math.PI/2;
        r1.add(seg);
    }

    // ── Kártya ──
    hologramGroup.add(new THREE.Mesh(
        new THREE.BoxGeometry(3.3, 1.9, 0.04),
        new THREE.MeshPhongMaterial({ color: 0x000d1a, emissive: 0x000510, transparent: true, opacity: 0.75, shininess: 200 })
    ));

    const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.9 });
    hologramGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(3.32, 1.92, 0.045)), edgeMat));
    window._adaptMats.push({mat: edgeMat, role:'primary'});

    hologramGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.5, 0.28, 0.026), new THREE.Vector3(1.5, 0.28, 0.026)]),
        new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.3 })
    ));

    // Sarkok
    [[1.5,0.9],[-1.5,0.9],[1.5,-0.9],[-1.5,-0.9]].forEach(([x,y]) => {
        const sx = x>0?1:-1, sy = y>0?1:-1;
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.85 });
        const g = new THREE.Group(); g.position.set(x, y, 0.027);
        const h2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.013, 0.001), mat);
        h2.position.x = -sx*0.1;
        const v2 = new THREE.Mesh(new THREE.BoxGeometry(0.013, 0.2, 0.001), mat.clone());
        v2.position.y = -sy*0.1;
        g.add(h2, v2); hologramGroup.add(g);
    });

    // ── Szöveg textúra ──
    const tc = document.createElement('canvas'); tc.width=1024; tc.height=512;
    const ctx = tc.getContext('2d');

    ctx.clearRect(0,0,1024,512);
    ctx.fillStyle = 'rgba(0,10,20,0.82)';
    rrect(ctx,6,6,1012,500,10); ctx.fill();

    ctx.font = 'bold 66px Orbitron,monospace';
    ctx.fillStyle = '#00ffcc'; ctx.textAlign = 'center';
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 22;
    ctx.fillText('KOVÁCS AI-GÁBOR', 512, 140);

    ctx.font = '23px "Share Tech Mono",monospace';
    ctx.fillStyle = '#8a2be2'; ctx.shadowColor = '#8a2be2'; ctx.shadowBlur = 10;
    ctx.fillText('// LEAD AI ENGINEER  ·  NEURAL ARCHITECT //', 512, 195);

    ctx.shadowBlur = 0;
    const gr = ctx.createLinearGradient(80,0,944,0);
    gr.addColorStop(0,'transparent'); gr.addColorStop(0.3,'#00ffcc99');
    gr.addColorStop(0.7,'#00ffcc99'); gr.addColorStop(1,'transparent');
    ctx.strokeStyle = gr; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(80,222); ctx.lineTo(944,222); ctx.stroke();

    ctx.font = '21px "Share Tech Mono",monospace';
    ctx.fillStyle = '#00ffcccc'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 5;
    ctx.fillText('ai@kovacs.dev   ·   Budapest, HU   ·   +36 XX XXX XXXX', 512, 295);

    ctx.font = '17px "Share Tech Mono",monospace';
    ctx.fillStyle = '#00ffcc66'; ctx.shadowBlur = 2;
    ctx.fillText('github.com/kovacs-ai   ·   linkedin.com/in/kovacs-ai-gabor', 512, 342);

    ctx.font = 'bold 14px "Share Tech Mono",monospace';
    ctx.fillStyle = '#ff005599'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 8;
    ctx.fillText('[ HEALTH AI · LLM · PYTORCH · NEURAL NETWORKS ]', 512, 400);

    const tex = new THREE.CanvasTexture(tc);
    hologramGroup.add(new THREE.Mesh(
        new THREE.PlaneGeometry(3.18, 1.78),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 1 })
    )).position.z = 0.027;

    // ── Lebegő gömb ──
    const sp = new THREE.Mesh(new THREE.SphereGeometry(0.36,32,32),
        new THREE.MeshPhongMaterial({ color:0x00ffcc, emissive:0x00ffcc, emissiveIntensity:0.35, transparent:true, opacity:0.18, shininess:300 }));
    sp.position.set(0,1.62,0); sp.name='sp'; hologramGroup.add(sp);
    window._adaptMats.push({mat: sp.material, role:'primary'});

    const sw = new THREE.Mesh(new THREE.SphereGeometry(0.37,16,16),
        new THREE.MeshBasicMaterial({ color:0x00ffcc, wireframe:true, transparent:true, opacity:0.32 }));
    sw.position.copy(sp.position); sw.name='sw'; hologramGroup.add(sw);
    window._adaptMats.push({mat: sw.material, role:'primary'});

    const ic = new THREE.Mesh(new THREE.IcosahedronGeometry(0.52,0),
        new THREE.MeshBasicMaterial({ color:0x8a2be2, wireframe:true, transparent:true, opacity:0.42 }));
    ic.position.copy(sp.position); ic.name='si'; hologramGroup.add(ic);
    window._adaptMats.push({mat: ic.material, role:'secondary'});

    // ── Skill bárok ──
    [0.92,0.88,0.95,0.80,0.97].forEach((v,i) => {
        const col = i%2===0 ? 0x00ffcc : 0x8a2be2;
        const h2 = v*0.95;
        const bar = new THREE.Mesh(
            new THREE.BoxGeometry(0.11, h2, 0.11),
            new THREE.MeshPhongMaterial({ color:col, emissive:col, emissiveIntensity:0.55, transparent:true, opacity:0.65 })
        );
        bar.position.set(-1.05+i*0.53, -1.4-h2/2, 0.027); bar.name=`br${i}`;
        hologramGroup.add(bar);
        window._adaptMats.push({mat: bar.material, role: i%2===0?'primary':'secondary'});
    });
}

function rrect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function buildParticles() {
    const cnt=130, pos=new Float32Array(cnt*3), col=new Float32Array(cnt*3);
    for(let i=0;i<cnt;i++){
        pos[i*3]=(Math.random()-0.5)*11;
        pos[i*3+1]=(Math.random()-0.5)*8;
        pos[i*3+2]=(Math.random()-0.5)*5-2;
        const c = [[0,1,0.8],[0.54,0.17,0.89],[1,0,0.33]][i%3];
        col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size:0.045, vertexColors:true, transparent:true, opacity:0.6, sizeAttenuation:true })));
}

// ── ADAPTÍV SZÍN ELEMZÉS ──
window._lastSample = 0;
window._adaptMats = [];  // [{mat, role}] ahol role: 'primary'|'secondary'|'accent'

function analyzeAndApply() {
    const video = document.getElementById('camera-bg');
    if (!video.videoWidth || !window._sampleCtx) return;

    window._sampleCtx.drawImage(video, 0, 0, 64, 36);
    const data = window._sampleCtx.getImageData(16, 8, 32, 20).data;

    let r=0,g=0,b=0,n=0;
    for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    const rA=r/n/255, gA=g/n/255, bA=b/n/255;
    const brightness = 0.299*rA + 0.587*gA + 0.114*bA;
    const warmth = rA - bA;
    const maxC=Math.max(rA,gA,bA), minC=Math.min(rA,gA,bA);
    const sat = maxC>0.01 ? (maxC-minC)/maxC : 0;

    let pHex, sHex, aHex, modeTxt;

    if (brightness > 0.68) {
        // Világos háttér → sötét, telített
        pHex='#0077ff'; sHex='#cc00ff'; aHex='#ff4400'; modeTxt='DARK';
    } else if (brightness < 0.20) {
        // Sötét háttér → élénk neon
        pHex='#00ffdd'; sHex='#ff44ff'; aHex='#ffdd00'; modeTxt='NEON';
    } else if (warmth > 0.15) {
        // Meleg háttér (fa, tégla) → hideg kék/cyan
        pHex='#00ddff'; sHex='#0044ff'; aHex='#00ffaa'; modeTxt='COOL';
    } else if (warmth < -0.12) {
        // Hideg háttér (kék fal, ég) → meleg arany
        pHex='#ffaa00'; sHex='#ff6600'; aHex='#ffee33'; modeTxt='WARM';
    } else if (sat < 0.12) {
        // Szürke/semleges → eredeti cyberpunk
        pHex='#00ffcc'; sHex='#8a2be2'; aHex='#ff0055'; modeTxt='CYBER';
    } else {
        // Vegyes → komplementer
        const hue = ((Math.atan2(Math.sqrt(3)*(gA-bA), 2*rA-gA-bA)*180/Math.PI)+360)%360;
        const ch = (hue+180)%360;
        pHex='hsl('+ch+',100%,58%)';
        sHex='hsl('+((ch+70)%360)+',80%,52%)';
        aHex='hsl('+((ch+140)%360)+',100%,62%)';
        modeTxt='AUTO';
    }

    const pC = new THREE.Color(pHex);
    const sC = new THREE.Color(sHex);
    const aC = new THREE.Color(aHex);

    window._adaptMats.forEach(({mat, role}) => {
        const target = role==='primary' ? pC : role==='secondary' ? sC : aC;
        if (mat.color) {
            mat.color.r += (target.r - mat.color.r)*0.06;
            mat.color.g += (target.g - mat.color.g)*0.06;
            mat.color.b += (target.b - mat.color.b)*0.06;
        }
        if (mat.emissive) {
            mat.emissive.r += (target.r - mat.emissive.r)*0.06;
            mat.emissive.g += (target.g - mat.emissive.g)*0.06;
            mat.emissive.b += (target.b - mat.emissive.b)*0.06;
        }
    });

    // HUD CSS frissítés
    const hex = '#'+pC.getHexString();
    const shex = '#'+sC.getHexString();
    const ahex = '#'+aC.getHexString();
    document.querySelectorAll('.corner').forEach(el => el.style.borderColor=hex);
    document.getElementById('scanline').style.background='linear-gradient(90deg,transparent,'+hex+',transparent)';
    document.getElementById('scanline').style.boxShadow='0 0 8px '+hex;
    document.querySelectorAll('.dot').forEach(el => { el.style.background=hex; el.style.boxShadow='0 0 6px '+hex; });
    document.querySelectorAll('.stat b').forEach(el => el.style.color=hex);
    document.getElementById('btn-cyan').style.color=hex;
    document.getElementById('btn-cyan').style.borderColor=hex+'55';
    document.getElementById('btn-purple').style.color=shex;
    document.getElementById('btn-purple').style.borderColor=shex+'55';
    document.getElementById('btn-red').style.color=ahex;
    document.getElementById('btn-red').style.borderColor=ahex+'55';
    const modeEl = document.getElementById('adapt-mode');
    if(modeEl){ modeEl.textContent=modeTxt+' MODE'; modeEl.style.color=hex; }
}

// ── ANIMÁCIÓ ──
function animate() {
    requestAnimationFrame(animate);
    const t = Date.now()*0.001;

    // Adaptív szín ~8x/mp
    if (t - window._lastSample > 0.125) {
        window._lastSample = t;
        analyzeAndApply();
    }

    currentRotX += (targetRotX-currentRotX)*0.07;
    currentRotY += (targetRotY-currentRotY)*0.07;
    if (hologramGroup) {
        hologramGroup.rotation.x = currentRotX;
        hologramGroup.rotation.y = currentRotY;
        hologramGroup.position.y = Math.sin(t*0.5)*0.07;
    }
    if (ringGroup) {
        ringGroup.rotation.y = t*0.28;
        ringGroup.rotation.x = Math.sin(t*0.17)*0.13;
        if(ringGroup.children[0]) ringGroup.children[0].rotation.z = t*0.48;
        if(ringGroup.children[1]) ringGroup.children[1].rotation.z = -t*0.36;
    }

    const fy = 1.62+Math.sin(t*1.1)*0.09;
    const sp=hologramGroup.getObjectByName('sp');
    const sw=hologramGroup.getObjectByName('sw');
    const si=hologramGroup.getObjectByName('si');
    if(sp){ sp.position.y=fy; sp.rotation.y=t*0.7; }
    if(sw){ sw.position.y=fy; sw.rotation.y=-t*0.5; sw.rotation.x=t*0.3; }
    if(si){ si.position.y=fy; si.rotation.y=t*1.0; si.rotation.x=t*0.6; }

    for(let i=0;i<5;i++){
        const b=hologramGroup.getObjectByName(`br${i}`);
        if(b) b.material.emissiveIntensity = 0.28+Math.sin(t*2.2+i*0.9)*0.28;
    }

    renderer.render(scene, camera);
}

// ── GYRO ──
function setupGyro() {
    if (typeof DeviceOrientationEvent==='undefined') return;
    const enable = () => {
        window.addEventListener('deviceorientation', e => {
            if(e.beta===null) return;
            gyroAvailable = true;
            targetRotX = THREE.MathUtils.clamp((e.beta-80)*0.015, -0.6, 0.6);
            targetRotY = THREE.MathUtils.clamp(e.gamma*0.02, -0.8, 0.8);
        });
    };
    if (typeof DeviceOrientationEvent.requestPermission==='function') {
        DeviceOrientationEvent.requestPermission().then(s => { if(s==='granted') enable(); }).catch(()=>{});
    } else { enable(); }
}

// ── TOUCH ──
document.addEventListener('touchstart', e => {
    if(e.target.closest('#action-bar')) return;
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
}, {passive:true});

document.addEventListener('touchmove', e => {
    if(e.target.closest('#action-bar')||gyroAvailable) return;
    targetRotY = THREE.MathUtils.clamp((e.touches[0].clientX-touchStartX)*0.004,-1.2,1.2);
    targetRotX = THREE.MathUtils.clamp((e.touches[0].clientY-touchStartY)*0.003,-0.8,0.8);
}, {passive:true});

// ── INFO PANEL ──
function showInfo(title, body) {
    const p=document.getElementById('info-panel');
    document.getElementById('info-title').textContent = '// '+title+' //';
    document.getElementById('info-body').innerHTML = body.replace(/\n/g,'<br>');
    p.classList.add('visible');
    clearTimeout(infoTimer);
    infoTimer = setTimeout(()=>p.classList.remove('visible'), 5000);
}
</script>
